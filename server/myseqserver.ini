# ============================================================================
# Offset Scanner Patterns (used by the Offset Finder dialog, Button 4)
# ============================================================================
# Each section below configures one primary offset for EQGameScanner.
# ScanExecutable() reads Start (file offset into eqgame.exe), Pattern (bytes),
# and Mask (one char per byte: x=exact, ?=wildcard, t=target value to extract,
# o=placeholder replaced with a known pointer, tttttttt=8-byte QWORD pointer).
#
# These patterns are specific to a particular EQ client binary.  When EQ patches,
# the patterns may need to be updated.  Leave the sections below empty (or omit
# Start/Pattern/Mask) to disable auto-scanning for that offset.
#
# For x64 EQ (current live client):
#   - Pointers are 8 bytes; use 8 't' characters (tttttttt) in the mask.
#   - x64 code uses RIP-relative addressing, so patterns are code sequences
#     near the reference, not the raw absolute pointer bytes.
#   - To derive patterns: open eqgame.exe in a disassembler (e.g. IDA, Ghidra,
#     or x64dbg) and find the instruction that reads the global pointer you want.
#     Capture surrounding unique bytes as the pattern; mark the 8 pointer bytes
#     as 'tttttttt'.  Use the file offset of the start of your pattern as Start.
#
# Example INI section format:
#   [ZoneAddr]
#   Start=0x4F000
#   Pattern=\x48\x8B\x05\xXX\xXX\xXX\xXX ...
#   Mask=xxx????...tttttttt...
# ============================================================================

